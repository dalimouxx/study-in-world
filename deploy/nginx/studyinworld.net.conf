# Nginx du VPS — site studyinworld.net. À copier dans /etc/nginx/sites-available/ puis activer (voir deploy/README.md).
# Le HTTPS (certificat Let's Encrypt) est ajouté ensuite par certbot, qui complète ce fichier lui-même.
# Les ports 3100 (site) et 4100 (API) doivent correspondre à WEB_PORT et API_PORT de deploy/.env.

# www → adresse principale
server {
    listen 80;
    listen [::]:80;
    server_name www.studyinworld.net;
    return 301 https://studyinworld.net$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name studyinworld.net;

    # Documents des candidats (PDF, photos) envoyés depuis le portail.
    client_max_body_size 20m;

    # API (même domaine que le site : le cookie de connexion reste sur studyinworld.net)
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Site
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
