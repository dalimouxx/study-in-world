# Production sur VPS : base PostgreSQL, API NestJS et site Next.js.
# Lancement (depuis le dossier deploy/) : docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Le projet porte son propre nom (« studyinworld ») : ses conteneurs, réseaux et volumes ne se mélangent pas
# avec ceux des autres sites du VPS (Tunicom, Fixi). Aucun port n'est ouvert sur le VPS : la passerelle Caddy
# commune (platforms-edge-gateway-1, ports 80/443) joint l'API et le site par le réseau Docker
# « platforms-studyinworld-edge », sous les noms studyinworld-api et studyinworld-web, et gère le HTTPS.
# La base n'est que sur le réseau interne du projet.
name: studyinworld

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-siw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-siw}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-siw}?schema=public
      APP_URL: https://studyinworld.net
      FRONTEND_URL: https://studyinworld.net
      # Documents des candidats : dans un volume, pour survivre aux mises à jour des conteneurs.
      STORAGE_DIR: /data/documents
    volumes:
      - documents:/data/documents
    networks:
      default:
      edge:
        aliases: [studyinworld-api]

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: https://studyinworld.net/api
    restart: unless-stopped
    depends_on:
      - api
    networks:
      default:
      edge:
        aliases: [studyinworld-web]

volumes:
  pgdata:
  documents:

networks:
  # Réseau déjà créé sur le VPS et relié à la passerelle Caddy.
  edge:
    external: true
    name: platforms-studyinworld-edge
